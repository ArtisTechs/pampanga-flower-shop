name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build

  backend:
    name: Backend build + migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Throwaway database for this job only; credentials are CI-only placeholders.
    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: flower_shop_ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
          MYSQL_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: ci
      DB_PASSWORD: ci
      DB_NAME: flower_shop_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npm run migrate:prod

      - name: Run seeds
        run: npm run seed

      - name: Re-run migrations and seeds (idempotency check)
        run: |
          npm run migrate:prod
          npm run seed

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend production image
        run: docker build --target prod -t pampanga-flower-shop-api:ci backend

      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
