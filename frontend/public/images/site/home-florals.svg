<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 3000" width="600" height="3000">
  <!-- Home page backdrop: a long floral vine along the right edge. The stem enters and leaves at x=500 so the tile repeats seamlessly (repeat-y). -->
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f9c9d6" stop-opacity="0" />
      <stop offset="1" stop-color="#f9c9d6" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="peony" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f28fae" />
      <stop offset="0.55" stop-color="#f8c1d0" />
      <stop offset="1" stop-color="#fde9ee" />
    </linearGradient>
    <linearGradient id="peony-inner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e86b95" />
      <stop offset="1" stop-color="#f7b3c6" />
    </linearGradient>
    <linearGradient id="lily" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fbe3c9" />
      <stop offset="0.35" stop-color="#f6aec0" />
      <stop offset="1" stop-color="#fce4ea" />
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ee7fa3" />
      <stop offset="1" stop-color="#fbd3de" />
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fbb94" />
      <stop offset="1" stop-color="#cfdfc5" />
    </linearGradient>
    <radialGradient id="center" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#fff2c9" />
      <stop offset="1" stop-color="#f2c46d" />
    </radialGradient>

    <path id="p-round" d="M0 0 C-48 -20 -62 -96 -24 -128 C-8 -140 8 -140 24 -128 C62 -96 48 -20 0 0Z" />
    <path id="p-mid" d="M0 0 C-34 -24 -40 -82 0 -110 C40 -82 34 -24 0 0Z" />
    <path id="p-long" d="M0 0 C-22 -32 -28 -112 0 -170 C28 -112 22 -32 0 0Z" />
    <g id="leaf-shape">
      <path d="M0 0 C30 -22 72 -22 110 0 C72 22 30 22 0 0Z" fill="url(#leaf)" opacity="0.9" />
      <path d="M4 0 C40 -3 75 -2 104 0" fill="none" stroke="#89a67f" stroke-width="1.2" opacity="0.6" />
    </g>

    <g id="peony-bloom">
      <g fill="url(#peony)" stroke="#f3a3ba" stroke-width="0.8" opacity="0.95">
        <use xlink:href="#p-round" transform="rotate(0)" />
        <use xlink:href="#p-round" transform="rotate(51)" />
        <use xlink:href="#p-round" transform="rotate(103)" />
        <use xlink:href="#p-round" transform="rotate(154)" />
        <use xlink:href="#p-round" transform="rotate(206)" />
        <use xlink:href="#p-round" transform="rotate(257)" />
        <use xlink:href="#p-round" transform="rotate(309)" />
      </g>
      <g fill="url(#peony)" stroke="#ef94ae" stroke-width="0.8">
        <use xlink:href="#p-mid" transform="rotate(25) scale(0.85)" />
        <use xlink:href="#p-mid" transform="rotate(85) scale(0.85)" />
        <use xlink:href="#p-mid" transform="rotate(145) scale(0.85)" />
        <use xlink:href="#p-mid" transform="rotate(205) scale(0.85)" />
        <use xlink:href="#p-mid" transform="rotate(265) scale(0.85)" />
        <use xlink:href="#p-mid" transform="rotate(325) scale(0.85)" />
      </g>
      <g fill="url(#peony-inner)" opacity="0.9">
        <use xlink:href="#p-mid" transform="rotate(0) scale(0.45)" />
        <use xlink:href="#p-mid" transform="rotate(72) scale(0.45)" />
        <use xlink:href="#p-mid" transform="rotate(144) scale(0.45)" />
        <use xlink:href="#p-mid" transform="rotate(216) scale(0.45)" />
        <use xlink:href="#p-mid" transform="rotate(288) scale(0.45)" />
      </g>
      <circle r="15" fill="url(#center)" />
      <g fill="#d98a5a" opacity="0.8">
        <circle cx="-6" cy="-4" r="2" /><circle cx="5" cy="-7" r="2" /><circle cx="7" cy="5" r="2" /><circle cx="-4" cy="7" r="2" /><circle cx="0" cy="0" r="2" />
      </g>
    </g>

    <g id="lily-bloom">
      <g fill="url(#lily)" stroke="#f2a2b8" stroke-width="0.8" opacity="0.95">
        <use xlink:href="#p-long" transform="rotate(15) scale(0.9)" />
        <use xlink:href="#p-long" transform="rotate(75) scale(0.9)" />
        <use xlink:href="#p-long" transform="rotate(135) scale(0.9)" />
        <use xlink:href="#p-long" transform="rotate(195) scale(0.9)" />
        <use xlink:href="#p-long" transform="rotate(255) scale(0.9)" />
        <use xlink:href="#p-long" transform="rotate(315) scale(0.9)" />
      </g>
      <g fill="#e2809c" opacity="0.55">
        <circle cx="10" cy="-30" r="2.2" /><circle cx="18" cy="-44" r="1.8" /><circle cx="-26" cy="-18" r="2" /><circle cx="-38" cy="-26" r="1.6" />
        <circle cx="30" cy="12" r="2" /><circle cx="44" cy="20" r="1.6" /><circle cx="-12" cy="32" r="2" /><circle cx="-16" cy="46" r="1.6" />
      </g>
      <g stroke="#ec9db2" stroke-width="2" stroke-linecap="round" fill="none">
        <path d="M0 0 C-10 -30 -24 -52 -40 -62" /><path d="M0 0 C6 -32 14 -56 30 -70" /><path d="M0 0 C-30 -12 -52 -10 -70 -18" />
        <path d="M0 0 C28 -16 50 -22 68 -20" /><path d="M0 0 C-20 18 -34 30 -52 34" />
      </g>
      <g fill="#b9705c">
        <ellipse cx="-40" cy="-63" rx="5" ry="2.4" transform="rotate(-30 -40 -63)" />
        <ellipse cx="30" cy="-71" rx="5" ry="2.4" transform="rotate(30 30 -71)" />
        <ellipse cx="-71" cy="-18" rx="5" ry="2.4" transform="rotate(-10 -71 -18)" />
        <ellipse cx="69" cy="-20" rx="5" ry="2.4" transform="rotate(10 69 -20)" />
        <ellipse cx="-53" cy="35" rx="5" ry="2.4" transform="rotate(20 -53 35)" />
      </g>
      <circle r="9" fill="#fbe3c9" />
    </g>

    <g id="rose-bloom">
      <g fill="url(#rose)" stroke="#ea8aa8" stroke-width="0.8" opacity="0.92">
        <use xlink:href="#p-round" transform="rotate(10) scale(0.7)" />
        <use xlink:href="#p-round" transform="rotate(70) scale(0.7)" />
        <use xlink:href="#p-round" transform="rotate(130) scale(0.7)" />
        <use xlink:href="#p-round" transform="rotate(190) scale(0.7)" />
        <use xlink:href="#p-round" transform="rotate(250) scale(0.7)" />
        <use xlink:href="#p-round" transform="rotate(310) scale(0.7)" />
      </g>
      <g fill="url(#rose)" stroke="#e57a9c" stroke-width="0.8">
        <use xlink:href="#p-mid" transform="rotate(40) scale(0.55)" />
        <use xlink:href="#p-mid" transform="rotate(112) scale(0.55)" />
        <use xlink:href="#p-mid" transform="rotate(184) scale(0.55)" />
        <use xlink:href="#p-mid" transform="rotate(256) scale(0.55)" />
        <use xlink:href="#p-mid" transform="rotate(328) scale(0.55)" />
      </g>
      <path d="M-14 4 C-16 -12 4 -20 14 -8 C22 4 8 16 -4 10 C-12 6 -8 -6 2 -4" fill="none" stroke="#d9668c" stroke-width="2" stroke-linecap="round" opacity="0.75" />
    </g>

    <g id="bud">
      <use xlink:href="#p-mid" transform="scale(0.36)" fill="url(#rose)" stroke="#ea8aa8" stroke-width="2" />
      <path d="M0 0 c-8 -6 -10 -16 -4 -22 c2 8 6 12 4 22z M0 0 c8 -6 10 -16 4 -22 c-2 8 -6 12 -4 22z" fill="#a7bf9b" />
    </g>
  </defs>

  <rect x="240" y="0" width="360" height="3000" fill="url(#wash)" />

  <!-- stem: vertical at both tile edges for a seamless repeat -->
  <g fill="none" stroke="#a7bf9b" stroke-linecap="round" opacity="0.85">
    <path stroke-width="4" d="M500 0 C500 120 440 180 432 260 C424 400 500 520 440 700 C380 880 520 940 470 1080 C420 1220 510 1300 450 1450 C390 1620 500 1700 430 1850 C360 2000 520 2100 460 2250 C400 2420 510 2500 440 2650 C380 2800 500 2880 500 3000" />
    <path stroke-width="3" d="M458 520 C410 512 360 506 318 500" />
    <path stroke-width="3" d="M468 1300 C420 1296 372 1292 334 1288" />
    <path stroke-width="3" d="M452 1640 C490 1630 520 1622 548 1606" />
    <path stroke-width="3" d="M456 2090 C410 2086 364 2082 322 2078" />
  </g>

  <!-- leaves -->
  <use xlink:href="#leaf-shape" transform="translate(468 470) rotate(200)" />
  <use xlink:href="#leaf-shape" transform="translate(462 580) rotate(-24)" />
  <use xlink:href="#leaf-shape" transform="translate(452 880) rotate(165)" />
  <use xlink:href="#leaf-shape" transform="translate(478 940) rotate(-30) scale(0.85)" />
  <use xlink:href="#leaf-shape" transform="translate(466 1250) rotate(195) scale(0.9)" />
  <use xlink:href="#leaf-shape" transform="translate(472 1340) rotate(-20)" />
  <use xlink:href="#leaf-shape" transform="translate(452 1680) rotate(170) scale(0.85)" />
  <use xlink:href="#leaf-shape" transform="translate(470 2050) rotate(-28)" />
  <use xlink:href="#leaf-shape" transform="translate(446 2120) rotate(190) scale(0.9)" />
  <use xlink:href="#leaf-shape" transform="translate(468 2450) rotate(-22) scale(0.9)" />
  <use xlink:href="#leaf-shape" transform="translate(456 2860) rotate(200) scale(0.8)" />

  <g>
    <use xlink:href="#peony-bloom" transform="translate(432 260)" />
    <use xlink:href="#lily-bloom" transform="translate(440 700)" />
    <use xlink:href="#rose-bloom" transform="translate(470 1080)" />
    <use xlink:href="#peony-bloom" transform="translate(450 1450) rotate(20) scale(0.8)" />
    <use xlink:href="#lily-bloom" transform="translate(430 1850) rotate(25) scale(0.85)" />
    <use xlink:href="#rose-bloom" transform="translate(460 2250) rotate(-15) scale(1.1)" />
    <use xlink:href="#peony-bloom" transform="translate(440 2650) rotate(-12) scale(0.88)" />

    <use xlink:href="#bud" transform="translate(318 500) rotate(-80)" />
    <use xlink:href="#bud" transform="translate(334 1288) rotate(-84)" />
    <use xlink:href="#bud" transform="translate(548 1606) rotate(60)" />
    <use xlink:href="#bud" transform="translate(322 2078) rotate(-86)" />
  </g>

  <!-- scattered petals (static; motion lives in the FallingPetals component) -->
  <g fill="url(#peony)" opacity="0.7">
    <g transform="translate(210 170) rotate(30) scale(0.18)"><use xlink:href="#p-round" /></g>
    <g transform="translate(150 430) rotate(-50) scale(0.15)"><use xlink:href="#p-round" /></g>
    <g transform="translate(92 760) rotate(12) scale(0.13)"><use xlink:href="#p-round" /></g>
    <g transform="translate(250 980) rotate(80) scale(0.16)"><use xlink:href="#p-round" /></g>
    <g transform="translate(170 1220) rotate(-14) scale(0.14)"><use xlink:href="#p-round" /></g>
    <g transform="translate(230 1560) rotate(44) scale(0.17)"><use xlink:href="#p-round" /></g>
    <g transform="translate(110 1800) rotate(-30) scale(0.13)"><use xlink:href="#p-round" /></g>
    <g transform="translate(240 2000) rotate(66) scale(0.15)"><use xlink:href="#p-round" /></g>
    <g transform="translate(160 2380) rotate(8) scale(0.16)"><use xlink:href="#p-round" /></g>
    <g transform="translate(90 2600) rotate(-60) scale(0.12)"><use xlink:href="#p-round" /></g>
    <g transform="translate(220 2820) rotate(36) scale(0.14)"><use xlink:href="#p-round" /></g>
  </g>
</svg>
