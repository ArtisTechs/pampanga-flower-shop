name: pampanga-flower-shop

services:
  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    # Not published to the host; only reachable by other services on the compose network.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
      target: dev
    command: ["sh", "-c", "npm run migrate && npm run dev"]
    # Retries startup if MySQL isn't accepting connections yet (e.g. after `docker compose restart`).
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # Product image uploads (admin panel); leave empty to disable uploads.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-pampanga-flower-shop/products}
      # Customizer preview images; leave the credentials empty to show the closest stock preview instead.
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-cloudflare}
      IMAGE_GENERATIONS_PER_HOUR: ${IMAGE_GENERATIONS_PER_HOUR:-20}
      PREVIEW_MAX_ATTEMPTS: ${PREVIEW_MAX_ATTEMPTS:-6}
      PREVIEW_TIME_BUDGET_SECONDS: ${PREVIEW_TIME_BUDGET_SECONDS:-240}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_AI_TOKEN: ${CLOUDFLARE_AI_TOKEN:-}
      CLOUDFLARE_IMAGE_MODEL: ${CLOUDFLARE_IMAGE_MODEL:-@cf/black-forest-labs/flux-2-klein-4b}
      CLOUDFLARE_IMAGE_STEPS: ${CLOUDFLARE_IMAGE_STEPS:-8}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-gemini-2.5-flash-image}
      GEMINI_CHECK_MODEL: ${GEMINI_CHECK_MODEL:-gemini-flash-lite-latest}
      GEMINI_CHECK_FALLBACK_MODEL: ${GEMINI_CHECK_FALLBACK_MODEL:-gemini-flash-latest}
      # OTP emails; leave empty to print codes in the backend logs instead.
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Pampanga Flower Shop}
      # File-change events don't cross Windows/macOS bind mounts reliably.
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      # Server-side proxy target for /api; the browser itself only talks to localhost:5173.
      API_PROXY_TARGET: http://backend:4000
      VITE_USE_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started

volumes:
  db_data:
